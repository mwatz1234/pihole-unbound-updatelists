# Pi-hole + Unbound (recursive DNS) + pihole-updatelists
# CONFIG APPROACH: Environment variables
#
# All settings controlled via environment variables in this file.
#
# KEY DIFFERENCE from DoT/DoH variants:
#   Unbound is a fully RECURSIVE DNS resolver -- it queries root servers directly,
#   not a third-party upstream (Cloudflare, Google, etc.). This means:
#   - Maximum privacy: no single upstream sees all your queries
#   - DNSSEC is validated by unbound itself
#   - Set FTLCONF_dns_dnssec=false -- unbound handles DNSSEC; double-validation causes errors
#
# Want lancache (Steam, Epic, Xbox etc. CDN redirects) in addition to unbound?
#   Use: mwatz/pihole-unbound-updatelists-lancache-cache-domains:latest
#   See: examples/docker-compose.env-vars.yml in that repo for the full example.
#
# To switch to file-based pihole-updatelists config instead of env vars:
#   - Uncomment the ./pihole-updatelists volume line below
#   - Create ./pihole-updatelists/pihole-updatelists.conf with your list URLs
#   - Remove the BLOCKLISTS_URL / WHITELIST_URL / REGEX_BLACKLIST_URL env vars
#   See examples/docker-compose.file-config.yml for the file-based approach

services:
  pihole:
    container_name: pihole
    image: mwatz/pihole-unbound-updatelists:latest
    hostname: pihole
    domainname: pihole.local
    ports:
      - "53:53/tcp"    # DNS
      - "53:53/udp"    # DNS
      - "80:80/tcp"    # Admin UI HTTP (redirects to HTTPS)
      - "443:443/tcp"  # Admin UI HTTPS
      # - "67:67/udp"  # DHCP -- uncomment if using Pi-hole as DHCP server (Linux only)
    environment:
      # -- Required -------------------------------------------------------------
      - TZ=America/Los_Angeles
      - FTLCONF_webserver_api_password=<your-password-here>
      - FTLCONF_dns_upstreams=127.0.0.1#5335        # Routes queries through local unbound recursive resolver
      - FTLCONF_dns_listeningMode=all               # Listen on all interfaces (required in Docker)

      # -- Critical: disable Pi-hole's DNSSEC -- unbound handles it -------------
      # Unbound validates DNSSEC itself. Enabling Pi-hole's DNSSEC too causes
      # double-validation conflicts resulting in SERVFAIL on valid domains.
      - FTLCONF_dns_dnssec=false

      # -- Recommended ----------------------------------------------------------
      - FTLCONF_LOCAL_IPV4=192.168.1.10             # Your Pi-hole server's LAN IP

      # -- Optional Pi-hole settings -------------------------------------------
      # Local hostname resolution via your router (reverse DNS)
      # Pi-hole v6 uses a single combined variable (format: true,<CIDR>,<router-IP>,<local-domain>)
      #- FTLCONF_dns_revServers=true,192.168.1.0/24,192.168.1.1,localdomain

      # DHCP server -- requires 67:67/udp port + network_mode: host on Linux
      #- FTLCONF_dhcp_active=true
      #- FTLCONF_dhcp_start=192.168.1.100
      #- FTLCONF_dhcp_end=192.168.1.200
      #- FTLCONF_dhcp_router=192.168.1.1

      # -- pihole-updatelists ---------------------------------------------------
      # Runs on container start and weekly via cron (default: random time 3-4 AM Sunday)
      # BLOCKLISTS_URL: Collection/index URLs only -- not direct blocklist file URLs
      - BLOCKLISTS_URL=https://v.firebog.net/hosts/lists.php?type=tick https://www.github.developerdan.com/hosts/lists/ads-and-tracking-extended.txt
      # WHITELIST_URL: Exact-match domain whitelists (handcrafted false-positive lists)
      - WHITELIST_URL=https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/referral-sites.txt https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt https://raw.githubusercontent.com/mmotti/pihole-regex/master/whitelist.list
      # REGEX_BLACKLIST_URL: Regex-based blocking rules
      - REGEX_BLACKLIST_URL=https://raw.githubusercontent.com/mmotti/pihole-regex/master/regex.list
      # Other available variables:
      #- ALLOWLISTS_URL=          # Collection URLs for allowlist indexes
      #- BLACKLIST_URL=           # Exact domains to block (plain domain format, not hosts files)
      #- REGEX_WHITELIST_URL=     # Regex patterns for whitelisting

      # -- Scheduling overrides -----------------------------------------------
      #- CRONTAB_STRING=0 3 * * 0            # pihole-updatelists cron (default: random 3-4 AM Sunday)

    volumes:
      - './etc-pihole:/etc/pihole'           # Required: Pi-hole config + gravity DB
      # - './pihole-updatelists:/etc/pihole-updatelists' # Uncomment for file-based list config
    cap_add:
      - NET_ADMIN        # Required for DNS + routing
      - NET_BIND_SERVICE # Required for binding privileged ports (53, 80, 443)
      - SYS_NICE         # Optional: process priority management
      # - NET_RAW        # Only needed for DHCP (IPv6 neighbor discovery + IP conflict detection)
                         # Uncomment only if enabling 67:67/udp for DHCP
    restart: unless-stopped
