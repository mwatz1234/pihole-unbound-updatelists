# Pi-hole + Unbound + pihole-updatelists
# CONFIG APPROACH: File-based pihole-updatelists config
#
# pihole-updatelists reads list URLs from a mounted config file instead of env vars.
# This is useful when you want to version-control your list configuration separately.
#
# Setup:
#   1. Create ./pihole-updatelists/pihole-updatelists.conf with your list URLs
#      (copy the template from https://github.com/jacklul/pihole-updatelists)
#   2. Remove BLOCKLISTS_URL / WHITELIST_URL / REGEX_BLACKLIST_URL env vars
#   3. docker compose up -d

services:
  pihole:
    container_name: pihole
    image: mwatz/pihole-unbound-updatelists:latest
    hostname: pihole
    domainname: pihole.local
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
      # - "67:67/udp"  # DHCP -- uncomment if using Pi-hole as DHCP server
    environment:
      - TZ=America/Los_Angeles
      - FTLCONF_webserver_api_password=<your-password-here>
      - FTLCONF_dns_upstreams=127.0.0.1#5335
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_dns_dnssec=false                    # Unbound handles DNSSEC -- do not enable both
      - FTLCONF_LOCAL_IPV4=192.168.1.10
      #- FTLCONF_dns_revServers=true,192.168.1.0/24,192.168.1.1,localdomain
      #- CRONTAB_STRING=0 3 * * 0
    volumes:
      - './etc-pihole:/etc/pihole'
      - './pihole-updatelists:/etc/pihole-updatelists'  # Mount your config file here
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - SYS_NICE
      # - NET_RAW  # Only needed for DHCP
    restart: unless-stopped
